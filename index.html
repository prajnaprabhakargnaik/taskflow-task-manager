
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>TaskFlow</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <section class="stats">
      <div class="stat-card">
        <h3 id="total">0</h3>
        <p>Total Tasks</p>
      </div>
      <div class="stat-card">
        <h3 id="pending">0</h3>
        <p>Pending</p>
      </div>
      <div class="stat-card">
        <h3 id="completed">0</h3>
        <p>Completed</p>
      </div>
    </section>

    <form id="taskForm">
      <input id="taskInput" type="text"
        placeholder="Enter a new task..." required>
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="pending">Pending</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage">No tasks yet. Add your first task!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
